injectRequestHeaders:
- name: Authorization
  values:
  - claim: access_token
    prefix: "Bearer "
providers:
- provider: oidc
  clientID: tiled
  # Keycloak client is public (PKCE); oauth2-proxy still requires a non-empty secret
  clientSecret: unused
  code_challenge_method: S256
  id: authn
  oidcConfig:
    audienceClaims: ["aud"]
    extraAudiences: ["account"]
    emailClaim: sub
    insecureAllowUnverifiedEmail: true
    insecureSkipNonce: true
    issuerURL: http://localhost:8081/realms/master
server:
  BindAddress: localhost:4181
  SecureBindAddress: ""
  TLS: null
upstreamConfig:
  proxyRawPath: true
  upstreams:
  - id: tiled
    path: /
    uri: http://localhost:8407
