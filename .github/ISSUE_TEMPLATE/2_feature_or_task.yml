name: Feature request or task
description: Suggest a new feature, design change or piece of work
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Please search [existing issues](https://github.com/DiamondLightSource/blueapi/issues?q=is%3Aissue) first. Open-ended ideas are better started in [Discussions](https://github.com/DiamondLightSource/blueapi/discussions).
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, who needs it, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to happen. Rough ideas are fine.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've thought about.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Specific criteria that will be used to judge if the issue is done.
      placeholder: "- Users can do X from the CLI"
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd be willing to open a pull request for this
