# Source: blueapi/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: release-name-blueapi-config
data:
  config.yaml: |-
    api:
      url: http://0.0.0.0:8000/
    env:
      events:
        broadcast_status_events: false
      metadata:
        instrument: p48
      sources:
      - kind: deviceManager
        module: dodal.beamlines.training_rig
      - kind: planFunctions
        module: dodal.plans
    logging:
      graylog:
        enabled: true
        url: tcp://graylog-log-target.diamond.ac.uk:12231/
      level: INFO
    numtracker:
      url: https://numtracker-staging.diamond.ac.uk/graphql
    oidc:
      client_audience: account
      client_id: blueapiCli
      logout_redirect_endpoint: oauth2/sign_out
      well_known_url: https://identity.diamond.ac.uk/realms/dls/.well-known/openid-configuration
    scratch:
      repositories:
      - name: dodal
        remote_url: https://github.com/DiamondLightSource/dodal.git
      - name: htss-rig-bluesky
        remote_url: https://github.com/DiamondLightSource/htss-rig-bluesky.git
        target_revision: update-copier-template
      root: /workspaces
    stomp:
      auth:
        password: guest
        username: guest
      enabled: true
      url: tcp://p48-rabbitmq-daq.diamond.ac.uk:61613
    tiled:
      authentication:
        client_id: p48TiledWriter
        client_secret: ${TILED_WRITER_SECRET}
      enabled: true
      url: https://tiled.diamond.ac.uk/api/v1/
