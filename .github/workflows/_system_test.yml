on:
  workflow_call:

env:
  # https://github.com/pytest-dev/pytest/issues/2042
  PY_IGNORE_IMPORTMISMATCH: "1"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # Check out example services
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Download blueapi image
        uses: actions/download-artifact@v8
        with:
          name: blueapi-image
          path: /tmp

      - name: Load blueapi image
        run: |
          docker load -i /tmp/blueapi-image.tar
          docker tag tag_for_testing blueapi-system-test

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Compose services
        run: docker compose -f tests/system_tests/compose.yaml up -d

      - name: Wait for Blueapi Server
        run: timeout 300 sh -c 'until [ "$(docker inspect -f {{.State.Health.Status}} $(docker compose -f tests/system_tests/compose.yaml ps -q blueapi))" = healthy ]; do sleep 5; done'

      - name: Run tests
        run: uv run --locked tox -e system-test
