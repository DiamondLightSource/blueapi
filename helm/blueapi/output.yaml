apiVersion: v1
kind: Pod
metadata:
  name: "release-name-blueapi-test-connection"
  labels:
    helm.sh/chart: blueapi-0.1.0
    app.kubernetes.io/name: blueapi
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": test
spec:
  volumes:
  - name: test-config
    projected:
      sources:
        - configMap:
            name: release-name-blueapi-test-config
  containers:
    - name: ping
      volumeMounts:
      - name: worker-config
        mountPath: "/config"
        readOnly: true
      image: "ghcr.io/dan-fernandes/blueapi:0.1.0"
      imagePullPolicy: IfNotPresent
      command: ["blueapi"]
      args:
        - "-c"
        - "/config/config.yaml"
        - "controller"
        - "plans"
  restartPolicy: Never
