on:
  workflow_call:

env:
  # https://github.com/pytest-dev/pytest/issues/2042
  PY_IGNORE_IMPORTMISMATCH: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # Check out example services
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Install browser for device flow login
        run: uv run --locked playwright install --with-deps chromium

      - name: Run tests
        # Starts the services, see tests/system_tests/stack.py
        run: uv run --locked tox -e system-test

      - name: Service logs
        if: failure()
        run: tail -n +1 tests/system_tests/logs/*
