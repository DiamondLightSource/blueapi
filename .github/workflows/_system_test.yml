on:
  workflow_call:

env:
  # https://github.com/pytest-dev/pytest/issues/2042
  PY_IGNORE_IMPORTMISMATCH: "1"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # Check out example services
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Compose services
        uses: hoverkraft-tech/compose-action@b659c744ee9bed25aea2307c017ad849bd104433 # v3.2.0
        with:
          compose-file: "tests/system_tests/compose.yaml"

      - name: Wait for Blueapi Server
        run: timeout 300 sh -c 'until [ "$(docker inspect -f {{.State.Health.Status}} $(docker compose -f tests/system_tests/compose.yaml ps -q blueapi))" = healthy ]; do sleep 5; done'

      - name: Run tests
        run: uv run --locked tox -e system-test
