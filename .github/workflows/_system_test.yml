on:
  workflow_call:

env:
  # https://github.com/pytest-dev/pytest/issues/2042
  PY_IGNORE_IMPORTMISMATCH: "1"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # Check out example services
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Read dodal version from uv.lock
        run: echo "DODAL_VERSION=$(grep -A1 '^name = "dls-dodal"$' uv.lock | sed -n 's/^version = "\(.*\)"$/\1/p')" >> "$GITHUB_ENV"

      - name: Compose services
        # Wait on blueapi only: --wait on everything fails on the one-shot init container exiting
        run: |
          docker compose -f tests/system_tests/compose.yaml --profile ci up -d
          docker compose -f tests/system_tests/compose.yaml --profile ci up -d --wait --wait-timeout 600 blueapi

      - name: Run tests
        run: uv run --locked tox -e system-test

      - name: Compose logs
        if: failure()
        run: docker compose -f tests/system_tests/compose.yaml --profile ci logs
