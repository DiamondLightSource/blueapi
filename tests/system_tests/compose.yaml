include:
  - path:
      - ../../example-services/compose.yaml
      - ./services/example-services-override.yaml

services:
  numtracker:
    # TODO: pin a numtracker release that sends instrument/instrument_session
    # to OPA (DiamondLightSource/numtracker branch move-to-central-authz)
    image: ${NUMTRACKER_IMAGE:-ghcr.io/diamondlightsource/numtracker:1.0.2}
    network_mode: host # Port 8406
    environment:
      - NUMTRACKER_AUTHZ_HOST=http://localhost:8181
      - NUMTRACKER_PORT=8406
      - NUMTRACKER_LOG_LEVEL=info
      - NUMTRACKER_AUTHZ_ACCESS=v1/data/diamond/session/access
      - NUMTRACKER_AUTHZ_ADMIN=v1/data/diamond/admin/configure_instrument
      # numtracker 1.0.2 (the default image) reads these names instead. Set
      # so that it still enforces authorisation rather than starting with it
      # off; it sends beamline/visit, which the central rules refuse, so
      # NUMTRACKER_IMAGE has to be a numtracker that sends instrument_session.
      - NUMTRACKER_AUTH_HOST=http://localhost:8181
      - NUMTRACKER_AUTH_ACCESS=v1/data/diamond/session/access
      - NUMTRACKER_AUTH_ADMIN=v1/data/diamond/admin/configure_instrument
    security_opt:
      - label=disable

  rabbitmq:
    image: docker.io/rabbitmq:4.0-management
    ports:
      - "1883:1883" # mqtt
      - "5672:5672" # amqp
      - "15672:15672" # dashboard
      - "61613:61613" # stomp
    volumes:
      - type: bind
        source: ./services/rabbitmq_plugins
        target: /etc/rabbitmq/enabled_plugins
    security_opt:
      - label=disable

  keycloak:
    image: keycloak/keycloak:26.4
    environment:
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_HOSTNAME=http://localhost:8081
    command: ["start-dev"]
    ports:
      - 8081:8080
    healthcheck:
      test: /opt/keycloak/bin/kcadm.sh config credentials --server http://keycloak:8080 --realm master --user admin --password admin
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - label=disable

  configure-services:
    image: ghcr.io/astral-sh/uv:python3.13-alpine
    network_mode: host
    volumes:
      - ./services/startup.py:/startup.py:ro
    environment:
      - KEYCLOAK_SERVER=http://localhost:8081
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KEYCLOAK_REALM=master
      - NT_URL=http://localhost:8406/graphql
    command: ["uv", "run", "/startup.py"]
    depends_on:
      keycloak:
        condition: service_healthy
    security_opt:
      - label=disable

  tiled:
    # TODO: pin a dls-tiled release using the central authorisation tiled rules
    # (DiamondLightSource/dls-tiled branch move-to-central-authz)
    image: ${TILED_IMAGE:-ghcr.io/diamondlightsource/dls-tiled:0.5.0}
    network_mode: host # Port 8407
    environment:
      - VITE_LOGIN_REDIRECT=false
    volumes:
      - ./services/tiled_config:/deploy/config
    # dls-tiled serve tells the access policy where nodes are created
    command: ["dls-tiled", "serve", "config", "--host", "0.0.0.0", "--port", "8407"]
    depends_on:
      keycloak:
        condition: service_healthy
    security_opt:
      - label=disable

  # Central authorisation OPA (gitlab.diamond.ac.uk/auth-auth/authorisation),
  # built from a local checkout. With no BUNDLER_BEARER_TOKEN it serves the
  # data in /dummy_bundle, which we replace with the system-test data.
  opa:
    build:
      context: ${AUTHORISATION_REPO:-../../../authorisation}
    image: localhost/diamond-authorisation:system-test
    network_mode: host # Port 8181
    volumes:
      - ./services/opa_config/dummy_bundle:/dummy_bundle:ro
    environment:
      - ISSUER=http://localhost:8081/realms/master
    depends_on:
      keycloak:
        condition: service_healthy
    security_opt:
      - label=disable

  # CI only, locally run the server with `just serve` (uv) instead
  blueapi:
    profiles: [ci]
    build:
      context: ../..
      target: runtime
    network_mode: host # Port 8000
    environment:
      - EPICS_CA_NAME_SERVERS=127.0.0.1:9064
      - EPICS_PVA_NAME_SERVERS=127.0.0.1:9075
      - DODAL_VERSION
    # A huge default nofile limit makes the EPICS CA client spin and devices fail to connect
    ulimits:
      nofile: 1024
    volumes:
      - ./config.yaml:/blueapi/config.yaml:ro
      - ./config-scratch.yaml:/blueapi/config-scratch.yaml:ro
      - ./services/blueapi/start.sh:/blueapi/start.sh:ro
    entrypoint: ["sh", "/blueapi/start.sh"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 10
      # setup-scratch plus device connection can take several minutes
      start_period: 300s
    depends_on:
      configure-services:
        condition: service_completed_successfully
    security_opt:
      - label=disable

  blueapi-oauth2-proxy:
    network_mode: host # Port 4180
    image: "quay.io/oauth2-proxy/oauth2-proxy:v7.13.0"
    volumes:
      - ./services/blueapi-oauth2-proxy/:/opt/config
    command:
      [
        "--alpha-config=/opt/config/oauth2-alpha.yaml",
        "--config=/opt/config/oauth2-proxy.cfg",
      ]
    depends_on:
      keycloak:
        condition: service_healthy
    security_opt:
      - label=disable

  tiled-oauth2-proxy:
    network_mode: host # Port 4181
    image: "quay.io/oauth2-proxy/oauth2-proxy:v7.13.0"
    volumes:
      - ./services/tiled-oauth2-proxy/:/opt/config
    command:
      [
        "--alpha-config=/opt/config/oauth2-alpha.yaml",
        "--config=/opt/config/oauth2-proxy.cfg",
      ]
    depends_on:
      keycloak:
        condition: service_healthy
    security_opt:
      - label=disable
