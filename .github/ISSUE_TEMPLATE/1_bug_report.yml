name: Bug report
description: Report a bug or unexpected behaviour
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! Please search [existing issues](https://github.com/DiamondLightSource/blueapi/issues?q=is%3Aissue) (including closed ones) first.
        Questions belong in [Discussions](https://github.com/DiamondLightSource/blueapi/discussions). Please report security vulnerabilities [privately](https://github.com/DiamondLightSource/blueapi/security/advisories/new), not here.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps, commands, config or plan that shows the bug.
      placeholder: |
        1. Start the server with `blueapi -c config.yaml serve`
        2. Run `blueapi controller run -i cm12345-1 my_plan '{"x": 1}'`
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and tracebacks
      description: Paste any relevant output. It is formatted as code automatically.
      render: text
  - type: input
    id: version
    attributes:
      label: blueapi version
      description: Output of `blueapi --version`
      placeholder: blueapi, version 1.2.3
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where are you running blueapi?
      options:
        - Beamline deployment (Kubernetes/Helm)
        - Local or developer machine
        - Other (say in the description)
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact on operations
      description: Helps the support team set a `support:` priority label.
      options:
        - Blocking experiments or users right now
        - Significant, workaround is painful
        - Noticeable, workaround exists
        - Minor or cosmetic
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know this is fixed?
      placeholder: "- Running X no longer raises Y"
