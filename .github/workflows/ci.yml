name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  merge_group:
<<<<<<< before updating
    types: [checks_requested]
=======
>>>>>>> after updating

jobs:
  # Check jobs skip pushes to main: merge_group already ran them on the same commit.
  # docs still runs there because publish.yml deploys the main docs from it.
  lint:
    if: github.ref != 'refs/heads/main'
    uses: ./.github/workflows/_tox.yml
    with:
      tox: pre-commit,type-checking

  test:
    if: github.ref != 'refs/heads/main'
    strategy:
      matrix:
        runs-on: ["ubuntu-latest"] # can add windows-latest, macos-latest
        python-version: ["3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    uses: ./.github/workflows/_test.yml
    with:
      runs-on: ${{ matrix.runs-on }}
      python-version: ${{ matrix.python-version }}

  system-test:
    if: github.ref != 'refs/heads/main'
    uses: ./.github/workflows/_system_test.yml

  container:
    needs: test
    if: ${{ !cancelled() && github.ref != 'refs/heads/main' }}
    uses: ./.github/workflows/_container.yml
    with:
      publish: ${{ needs.test.result == 'success' }}
    permissions:
      contents: read
      packages: write

  docs: # Call the docs building workflow directly
    uses: DiamondLightSource/myst-version-switcher-plugin/.github/workflows/docs.yml@v0.28.0
    with:
      # Whatever turns your sources into docs/_build/html at $BASE_URL. uv and Node
      # are preinstalled, so: make docs · tox -e docs · npm ci && npm run docs
      build-command: uv run --locked tox -e docs
      html-dir: build/html

  dist:
    if: github.ref != 'refs/heads/main'
    uses: ./.github/workflows/_dist.yml

  pypi:
    needs: [dist, test]
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/_pypi.yml
    permissions:
      id-token: write

  release:
    needs: [dist, test, docs]
    if: github.ref_type == 'tag' # tag pushes only
    uses: DiamondLightSource/myst-version-switcher-plugin/.github/workflows/release.yml@v0.28.0
    permissions:
      contents: write # create the Release + attach assets
